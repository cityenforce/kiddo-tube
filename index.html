<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>KiddoTube prototype (concept 3)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#F6F3EA;--card:#fff;--text:#1F2A44;--muted:#6B6556;--line:#E6E0D0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12172B;--card:#1B2340;--text:#F4F1EA;--muted:#B8C0E0;--line:#2E3860}}
:root[data-theme="dark"]{--bg:#12172B;--card:#1B2340;--text:#F4F1EA;--muted:#B8C0E0;--line:#2E3860}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;padding:14px}
#ph{width:100%;max-width:375px;margin:0 auto;background:#FFFDF7;color:#1F2A44;border:6px solid #1F2A44;border-radius:34px;min-height:660px;display:flex;flex-direction:column;overflow:hidden;position:relative}
#ph::before{content:"";display:block;height:8px;background:linear-gradient(90deg,#FFC93C 33%,#3A9BE8 33% 66%,#FF6F61 66%)}#scr{flex:1;display:flex;flex-direction:column;gap:12px;padding:18px 16px}
h1{margin:0;font-size:30px;font-weight:800}h2{margin:0;font-size:21px;font-weight:800}p{margin:0}
.m{color:#6B6556;font-size:13px}.err{color:#B3261E;font-size:13px;min-height:16px}
.btn,.btn2{border-radius:16px;padding:14px;font:800 16px system-ui;font-family:inherit;cursor:pointer;width:100%;min-height:48px;border:0}
.btn{background:#FFC93C;color:#1F2A44}.btn2{background:#fff;color:#1F2A44;border:1.5px solid #CFC8B4}
button:focus-visible,input:focus-visible{outline:3px solid #3A9BE8;outline-offset:2px}
input[type=text],input[type=email],input[type=password]{width:100%;min-height:48px;border:1.5px solid #CFC8B4;border-radius:14px;padding:0 14px;font:16px system-ui;font-family:inherit;background:#fff;color:#1F2A44}
label{font-size:13px;font-weight:700;display:block;margin-bottom:4px}
.row{display:flex;align-items:center;gap:10px}.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chip{flex:1;min-height:48px;border:1.5px solid #CFC8B4;border-radius:14px;background:#fff;font:700 15px system-ui;font-family:inherit;color:#1F2A44;cursor:pointer}
.chip.on{background:#3A9BE8;color:#fff;border-color:#3A9BE8}
.tile{border:0;border-radius:18px;min-height:74px;font:800 15px system-ui;font-family:inherit;color:#1F2A44;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile.sel{outline:3px solid #1F2A44}
.vid{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #E6E0D0;border-radius:14px;padding:8px;cursor:pointer;width:100%;text-align:left;font-family:inherit;color:#1F2A44;min-height:60px}
.th{width:64px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:#fff;border:1.5px solid #CFC8B4;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1F2A44;flex:none}
.pill{background:#FFC93C;border-radius:14px;padding:5px 10px;font-size:13px;font-weight:800;display:flex;gap:4px;align-items:center}
.av{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 32px system-ui;font-family:inherit;color:#fff;border:0;cursor:pointer}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid #E6E0D0;border-radius:14px;padding:12px;min-height:52px;width:100%;font:700 15px system-ui;font-family:inherit;color:#1F2A44;cursor:pointer;text-align:left}
.key{min-height:56px;border-radius:16px;border:1.5px solid #CFC8B4;background:#fff;font:800 22px system-ui;font-family:inherit;color:#1F2A44;cursor:pointer}
.dots{display:flex;gap:12px;justify-content:center;margin:6px 0}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #1F2A44}.dots i.f{background:#1F2A44}
.bar{height:8px;background:#E6E0D0;border-radius:4px}.bar b{display:block;height:8px;background:#FF6F61;border-radius:4px}
#toast{position:absolute;left:16px;right:16px;bottom:16px;background:#1F2A44;color:#fff;border-radius:14px;padding:12px;font-size:14px;text-align:center}
.dev{max-width:375px;margin:16px auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:14px;line-height:1.5}
.dev h3{margin:0 0 6px;font-size:16px}.dev ul{margin:6px 0;padding-left:18px}.dev code{background:var(--line);padding:1px 6px;border-radius:6px;font-size:13px}
.dev select,.dev button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit;font-size:14px;padding:0 12px;cursor:pointer}
.dev .r{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
@media (prefers-reduced-motion:no-preference){#scr{animation:in .18s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style></head>
<body>
<div id="ph"><div id="scr"></div></div>
<div class="dev"><h3>Developer handover</h3>
<div class="r"><label for="jump" style="margin:0;align-self:center">Jump to screen</label><select id="jump" onchange="go(this.value)"></select></div>
<div id="notes" style="margin-top:10px"></div>
<div class="r"><button onclick="S.used+=5;chk();render()">Use 5 min</button><button onclick="reset()">Reset demo</button></div>
<p class="m" style="color:var(--muted);margin-top:10px">Prototype data is mocked. Demo parent PIN: <code>1234</code>. Suggested stack: Flutter or React Native, Firebase or Node on AWS Sydney, no advertising SDKs.</p></div>
<script>
const IC={back:'<path d="M15 18l-6-6 6-6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',play:'<path d="M7 4l13 8-13 8z"/>',pause:'<path d="M8 5v14M16 5v14"/>',ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',chev:'<path d="M9 6l6 6-6 6"/>'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const logo=`<svg width="120" height="120" viewBox="0 0 110 110" role="img" aria-label="KiddoTube app icon"><circle cx="36" cy="18" r="12" fill="#FF6F61"/><circle cx="74" cy="18" r="12" fill="#FF6F61"/><rect x="12" y="24" width="86" height="78" rx="28" fill="#FFC93C"/><path d="M44 48v34l32-17z" fill="#3A9BE8"/></svg>`;
const sw=`<div style="display:flex;gap:10px;justify-content:center" aria-hidden="true"><i style="width:18px;height:18px;border-radius:50%;background:#FFC93C"></i><i style="width:18px;height:18px;border-radius:50%;background:#3A9BE8"></i><i style="width:18px;height:18px;border-radius:50%;background:#FF6F61"></i><i style="width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid #CFC8B4"></i></div>`;
const V=[[1,'Counting with Cubby','Learn',['2-4','5-7'],4,'#B5D4F4'],[2,'Rainbow song','Music',['2-4','5-7'],3,'#F5C4B3'],[3,'Sleepy bear','Stories',['2-4','5-7'],6,'#FFE08A'],[4,'Shapes in space','Learn',['5-7','8-12'],5,'#8FD9B6'],[5,'Dino dance','Fun',['2-4','5-7'],3,'#F5C4B3'],[6,'How rain works','Learn',['8-12'],7,'#B5D4F4'],[7,'Build a rocket','Fun',['5-7','8-12'],6,'#FFE08A'],[8,'Guitar basics','Music',['8-12'],8,'#8FD9B6'],[9,'The brave fox','Stories',['5-7','8-12'],9,'#F5C4B3']].map(v=>({id:v[0],t:v[1],topic:v[2],age:v[3],m:v[4],c:v[5]}));
const TOP={Learn:'#3A9BE8',Music:'#FF6F61',Stories:'#FFC93C',Fun:'#8FD9B6'};
const SRCH={Animals:['bear','fox','dino'],Songs:['music'],Shapes:['shape'],Space:['space','rocket'],Colors:['rainbow'],Stories:['stories']};
const COL=['#FF6F61','#3A9BE8','#8FD9B6','#FFC93C'];
const D=()=>({screen:'welcome',child:0,children:[{name:'Mia',age:'5-7'}],limit:30,used:0,blocked:[],topic:null,q:null,pin:'',err:'',vid:null,playing:false,prog:0,sheet:false,listen:false,draft:{age:null},toast:'',gate:'settings'});
let S=D(),timer=null,tt=null;
const $=s=>document.querySelector(s);
const kid=()=>S.children[S.child]||S.children[0];
const left=()=>Math.max(0,S.limit-S.used);
const vis=()=>V.filter(v=>v.age.includes(kid().age)&&!S.blocked.includes(v.id));
const NOTE={
welcome:['/welcome','Entry screen. One primary action.',['Show once per install, then skip if a parent is signed in','Tagline: "Safe screens. Big smiles."']],
signup:['/signup','Parent account with consent (Privacy Act, COPPA, GDPR-K).',['Validate: email format, password 8+ chars, consent ticked','Store consent timestamp and policy version','Collect the minimum data. No ad or tracking SDKs']],
addchild:['/child/new','Create a child profile: name and age group.',['Age groups 2-4, 5-7, 8-12 drive content filtering','Child name only. No photo, no surname, no location']],
profiles:['/profiles','Who is watching. Entry to the kid area.',['Multiple profiles per family','No password for kids. Parent area stays PIN-gated']],
kidhome:['/kid/home','Kid home. Browse by age.',['Query: approved videos where ageGroup matches and not blocked','Time-left pill from the daily limit','Gear icon opens the parent gate (only way into the parent area)']],
search:['/kid/search','Voice or icon search.',['Voice via on-device speech recognition where possible','Results come from the curated catalogue only. Never open web search','Do not store raw voice audio']],
player:['/kid/watch/:id','Video player with Report and Block.',['Report: reason list, sends to moderation queue (response-time target)','Block: hides for this profile and appears in the parent blocked list','Poll watch time and lock at the daily limit']],
timesup:['/kid/locked','Screen lock when the daily limit is reached.',['Cannot be dismissed by the child','Parent can add time after the PIN gate','Resets at local midnight']],
gate:['/parent/gate','Adult-only PIN gate.',['4-digit PIN set at sign-up (demo: 1234)','Lock for 60 seconds after 5 wrong attempts','Never show the PIN in logs']],
settings:['/parent/settings','Parent only settings hub.',['Links to Screen time and Manage profiles','Exit returns to profile picker']],
screentime:['/parent/screen-time','Daily limits.',['Stepper 15 to 120 min in 15 min steps','Store limit per profile and enforce on the device and server']],
manage:['/parent/profiles','Edit profiles and blocked content.',['Edit age group, remove profile (confirm in production)','Blocked videos list with Unblock','Admin web panel approves the catalogue (separate app)']]};
const topbar=(t,b)=>`<div class="row">${b?`<button class="ib" aria-label="Back" onclick="go('${b}')">${ic('back')}</button>`:''}<h2 style="flex:1">${t}</h2></div>`;
const vrow=v=>`<button class="vid" onclick="play(${v.id})"><span class="th" style="background:${v.c}">${ic('play',20)}</span><span><b style="font-size:15px">${v.t}</b><br><span class="m">${v.topic}, ${v.m} min</span></span></button>`;
const sc={
welcome:()=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px">${logo}<h1>KiddoTube</h1><p class="m" style="font-size:16px">Safe screens. Big smiles.</p>${sw}</div><button class="btn" onclick="go('signup')">Get started</button>`,
signup:()=>`${topbar('Create parent account','welcome')}<div><label for="e">Email</label><input id="e" type="email" placeholder="name@company.com" autocomplete="email"></div><div><label for="p">Password</label><input id="p" type="password" placeholder="At least 8 characters"></div><label style="display:flex;gap:10px;font-weight:600;align-items:flex-start"><input id="c" type="checkbox" style="width:24px;height:24px;flex:none">I'm the parent or guardian and I agree to the Privacy Policy and Terms.</label><div class="err" id="er">${S.err}</div><div style="flex:1"></div><button class="btn" onclick="doSignup()">Continue</button>`,
addchild:()=>`${topbar('Add a child',S.seen?'manage':'signup')}<div><label for="n">First name</label><input id="n" type="text" placeholder="Mia"></div><div><label>Age group</label><div class="row">${['2-4','5-7','8-12'].map(a=>`<button class="chip ${S.draft.age===a?'on':''}" onclick="S.draft.age='${a}';keepName()">${a}</button>`).join('')}</div></div><div class="err" id="er">${S.err}</div><div style="flex:1"></div><button class="btn" onclick="doAdd()">Add child</button>`,
profiles:()=>`<div style="text-align:center">${logo.replace(/width="120" height="120"/,'width="56" height="56"')}</div><h2 style="text-align:center;margin-top:4px">Who's watching?</h2><div class="g" style="justify-items:center;margin-top:12px">${S.children.map((c,i)=>`<div style="text-align:center"><button class="av" style="background:${COL[i%4]}" onclick="S.child=${i};S.topic=null;go('kidhome')" aria-label="Watch as ${c.name}">${c.name[0]}</button><p style="font-weight:800;margin-top:6px">${c.name}</p></div>`).join('')}<div style="text-align:center"><button class="av" style="background:#fff;color:#1F2A44;border:2px dashed #CFC8B4" onclick="go('addchild')" aria-label="Add child">+</button><p class="m" style="margin-top:6px">Add child</p></div></div>`,
kidhome:()=>{const l=vis().filter(v=>!S.topic||v.topic===S.topic);return `<div class="row"><div style="width:40px;height:40px;border-radius:50%;background:#FF6F61;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800">${kid().name[0]}</div><h2 style="flex:1">Hi ${kid().name}!</h2><span class="pill">${ic('clock',16)}${left()} min</span><button class="ib" aria-label="Parent area" onclick="S.gate='settings';go('gate')">${ic('gear')}</button></div><button class="li" onclick="go('search')" style="border-radius:20px">${ic('search')}<span style="flex:1;color:#6B6556">Search</span>${ic('mic')}</button><div class="g">${Object.keys(TOP).map(t=>`<button class="tile ${S.topic===t?'sel':''}" style="background:${TOP[t]};${t==='Music'?'color:#fff':''}" onclick="S.topic=S.topic==='${t}'?null:'${t}';render()">${t}</button>`).join('')}</div><b style="font-size:14px">Watch next</b>${l.length?l.map(vrow).join(''):'<p class="m">No videos here yet. Try another topic.</p>'}`},
search:()=>{const r=S.q?vis().filter(v=>SRCH[S.q].some(w=>(v.t+' '+v.topic).toLowerCase().includes(w))):[];return `${topbar('Search','kidhome')}<button class="btn2" onclick="listen()" style="display:flex;gap:8px;align-items:center;justify-content:center">${ic('mic')}${S.listen?'Listening...':'Tap and say a word'}</button><div class="g">${Object.keys(SRCH).map(k=>`<button class="chip ${S.q===k?'on':''}" onclick="S.q='${k}';render()">${k}</button>`).join('')}</div>${S.q?(r.length?r.map(vrow).join(''):'<p class="m">No videos for "'+S.q+'" at this age. Try another word.</p>'):''}`},
player:()=>{const v=V.find(x=>x.id===S.vid);return `${topbar(v.t,'kidhome')}<div style="height:170px;border-radius:18px;background:${v.c};display:flex;align-items:center;justify-content:center"><button class="ib" style="width:64px;height:64px" aria-label="${S.playing?'Pause':'Play'}" onclick="S.playing=!S.playing;S.playing?run():stop();render()">${ic(S.playing?'pause':'play',28)}</button></div><div class="bar"><b style="width:${S.prog}%"></b></div><div class="row"><span class="pill">${ic('clock',16)}${left()} min left</span></div>${S.sheet?`<b>Why are you reporting this?</b>${['It scared me','It is not for kids','Something else'].map(r=>`<button class="li" onclick="doReport()">${r}</button>`).join('')}<button class="btn2" onclick="S.sheet=false;render()">Cancel</button>`:`<div class="row"><button class="btn2" onclick="S.sheet=true;render()" style="display:flex;gap:6px;align-items:center;justify-content:center">${ic('flag',18)}Report</button><button class="btn2" onclick="doBlock(${v.id})" style="display:flex;gap:6px;align-items:center;justify-content:center">${ic('ban',18)}Block</button></div>`}`},
timesup:()=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px"><div style="width:96px;height:96px;border-radius:50%;background:#FFC93C;display:flex;align-items:center;justify-content:center">${ic('clock',48)}</div><h1>Time's up for today</h1><p class="m" style="font-size:16px">See you tomorrow, ${kid().name}!</p></div><button class="btn2" onclick="S.gate='screentime';go('gate')">Parent: add time</button>`,
gate:()=>`<div class="row"><button class="ib" aria-label="Cancel" onclick="S.pin='';go(left()?'kidhome':'timesup')">${ic('back')}</button></div><h2 style="text-align:center">Parent PIN</h2><p class="m" style="text-align:center">Enter your 4-digit PIN to continue.</p><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<S.pin.length?'f':''}"></i>`).join('')}</div><div class="err" style="text-align:center" id="er">${S.err}</div><div class="g" style="grid-template-columns:repeat(3,minmax(0,1fr))">${[1,2,3,4,5,6,7,8,9,'',0,'Del'].map(k=>k===''?'<span></span>':`<button class="key" onclick="key('${k}')">${k}</button>`).join('')}</div>`,
settings:()=>`${topbar('Parent area','profiles')}<p class="m">Signed in as ${S.email||'parent@example.com'}</p><button class="li" onclick="go('screentime')"><span>Screen time<br><span class="m">${S.limit} min a day</span></span>${ic('chev')}</button><button class="li" onclick="go('manage')"><span>Manage profiles<br><span class="m">${S.children.length} profile${S.children.length>1?'s':''}, ${S.blocked.length} blocked</span></span>${ic('chev')}</button><div style="flex:1"></div><button class="btn2" onclick="go('profiles')">Back to kid area</button>`,
screentime:()=>`${topbar('Screen time','settings')}<p class="m">Daily limit for every profile.</p><div class="row" style="justify-content:center;gap:20px;margin:10px 0"><button class="ib" aria-label="Less time" onclick="S.limit=Math.max(15,S.limit-15);render()" style="width:56px;height:56px;font-size:28px">-</button><div style="text-align:center"><div style="font-size:44px;font-weight:800">${S.limit}</div><div class="m">minutes</div></div><button class="ib" aria-label="More time" onclick="S.limit=Math.min(120,S.limit+15);render()" style="width:56px;height:56px;font-size:28px">+</button></div><div class="bar"><b style="width:${Math.min(100,S.used/S.limit*100)}%"></b></div><p class="m">Used today: ${S.used} of ${S.limit} min</p><button class="btn2" onclick="S.used=0;toast('Today\\'s time reset');render()">Reset today's time</button><div style="flex:1"></div><button class="btn" onclick="toast('Saved');go('settings')">Save limit</button>`,
manage:()=>`${topbar('Manage profiles','settings')}${S.children.map((c,i)=>`<div class="li" style="cursor:default"><span>${c.name}<br><span class="m">Age ${c.age}</span></span><span class="row"><button class="chip" style="min-width:64px;flex:none" onclick="cyc(${i})" aria-label="Change age group for ${c.name}">${c.age}</button>${S.children.length>1?`<button class="chip" style="min-width:64px;flex:none" onclick="rm(${i})">Remove</button>`:''}</span></div>`).join('')}<button class="btn2" onclick="go('addchild')">Add child</button><b style="font-size:14px;margin-top:6px">Blocked videos</b>${S.blocked.length?S.blocked.map(id=>`<div class="li" style="cursor:default"><span>${V.find(v=>v.id===id).t}</span><button class="chip" style="min-width:80px;flex:none" onclick="S.blocked=S.blocked.filter(x=>x!==${id});render()">Unblock</button></div>`).join(''):'<p class="m">Nothing blocked. Blocked videos appear here.</p>'}`};
function go(s){if(s!=='player')stop();S.err='';S.sheet=false;if(s==='gate')S.pin='';S.screen=s;render();window.scrollTo(0,0)}
function render(){$('#scr').innerHTML=sc[S.screen]();const n=NOTE[S.screen];$('#notes').innerHTML=`<b>${S.screen}</b> <code>${n[0]}</code><p>${n[1]}</p><ul>${n[2].map(x=>`<li>${x}</li>`).join('')}</ul>`;$('#jump').value=S.screen;if(S.toast){let t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.textContent=S.toast;$('#ph').appendChild(t);S.toast='';clearTimeout(tt);tt=setTimeout(()=>t.remove(),1800)}}
function toast(m){S.toast=m}
function keepName(){const n=$('#n').value;render();$('#n').value=n}
function doSignup(){const e=$('#e').value.trim(),p=$('#p').value,c=$('#c').checked;S.err=!/^\S+@\S+\.\S+$/.test(e)?'Enter a valid email address.':p.length<8?'Use at least 8 characters for your password.':!c?'Confirm you are the parent or guardian to continue.':'';if(S.err){$('#er').textContent=S.err;return}S.email=e;go('addchild')}
function doAdd(){const n=$('#n').value.trim();S.err=!n?"Enter your child's first name.":!S.draft.age?'Choose an age group.':'';if(S.err){$('#er').textContent=S.err;return}S.children.push({name:n,age:S.draft.age});S.draft.age=null;S.child=S.children.length-1;toast(n+' added');go(S.email&&!S.seen?'profiles':'manage');S.seen=1}
function play(id){S.vid=id;S.prog=0;S.playing=true;go('player');run()}
function run(){stop();timer=setInterval(()=>{S.used++;S.prog=Math.min(100,S.prog+8);if(!left()){chk();return}if(S.screen==='player'){const b=document.querySelector('.bar b');if(b)b.style.width=S.prog+'%';const p=document.querySelector('.pill');if(p)p.lastChild.textContent=left()+' min left'}},3000)}
function stop(){clearInterval(timer);S.playing=false}
function chk(){if(!left()&&!['gate','settings','screentime','manage','timesup'].includes(S.screen)){stop();go('timesup')}}
